<html lang="vi">
<head>
  <title>Nguyễn Thị Thu Trang</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>Giá Trị Cốt Lõi Của Tôi</h2>
  <p>Những nguyên tắc mà tôi luôn theo đuổi trong công việc và cuộc sống:</p>
  
  <ul class="list-group shadow-sm">
    <li class="list-group-item active d-flex justify-content-between align-items-center">
      Sự sáng tạo trong giải pháp
      <span class="badge bg-white text-primary rounded-pill">Ưu tiên 1</span>
    </li>
    
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Tinh thần học hỏi không ngừng
      <span class="badge bg-primary rounded-pill">Hàng ngày</span>
    </li>
    
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Trách nhiệm và cam kết
      <span class="badge bg-primary rounded-pill">Chuyên nghiệp</span>
    </li>
    
    <li class="list-group-item d-flex justify-content-between align-items-center text-muted">
      Làm việc nhóm và chia sẻ kiến thức
      <span class="badge bg-secondary rounded-pill">Cộng đồng</span>
    </li>
  </ul>
</div>

</body>
</html>
