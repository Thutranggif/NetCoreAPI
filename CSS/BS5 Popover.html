<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Giới Thiệu Bản Thân Thu Trang - Popover</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5 text-center">
  <h3>Tìm hiểu sâu hơn về tôi</h3>
  <p>Nhấp vào các nút bên dưới để xem thông tin chi tiết từng mục:</p>
  
  <div class="mt-4">
    <button type="button" class="btn btn-primary mx-2" 
            title="Kinh nghiệm làm việc" 
            data-bs-toggle="popover" data-bs-placement="top" 
            data-bs-content="Là một sinh viên sắp tốt nghiệp với nền tảng kiến thức vững chắc về ngành Công nghệ thông tin, tôi đang tìm kiếm cơ hội để cống hiến sự nhiệt huyết và tư duy sáng tạo của mình vào các dự án thực tế.">
      Kinh nghiệm
    </button>

    <button type="button" class="btn btn-success mx-2" 
            title="Học vấn" 
            data-bs-toggle="popover" data-bs-placement="bottom" 
            data-bs-content="Đang học tại trường ĐHMĐC">
      Học vấn
    </button>

    <button type="button" class="btn btn-info text-white mx-2" 
            title="Kỹ năng mềm" 
            data-bs-toggle="popover" data-bs-placement="left" 
            data-bs-content="Khả năng giao tiếp tốt, làm việc nhóm hiệu quả và giải quyết vấn đề sáng tạo.">
      Kỹ năng
    </button>

    <button type="button" class="btn btn-danger mx-2" 
            title="Triết lý sống" 
            data-bs-toggle="popover" data-bs-placement="right" 
            data-bs-content="Học hỏi không ngừng là con đường duy nhất để tiến về phía trước.">
      Triết lý
    </button>
  </div>
</div>

<script>
// Đoạn mã JavaScript để kích hoạt tất cả Popovers trên trang
var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
  return new bootstrap.Popover(popoverTriggerEl)
})
</script>

</body>
</html>
