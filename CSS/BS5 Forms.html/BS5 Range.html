<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Kỹ Năng Bản Thân</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>Mức độ thành thạo kỹ năng</h2>
  <p>Kéo thanh trượt để thể hiện mức độ tự tin của mình trong các lĩnh vực (từ 0 đến 100%):</p>
  
  <form action="/action_page.php">
    <div class="mb-4">
      <label for="skillWeb" class="form-label">Thiết kế Web (HTML/CSS/Bootstrap):</label>
      <input type="range" class="form-range" id="skillWeb" name="skillWeb" min="0" max="100" value="85">
      <div class="d-flex justify-content-between small text-muted">
        <span>Cơ bản</span>
        <span>Thành thạo</span>
      </div>
    </div>
    
    <div class="mb-4">
      <label for="skillLang" class="form-label">Tiếng Anh chuyên ngành:</label>
      <input type="range" class="form-range" id="skillLang" name="skillLang" min="0" max="100" value="70">
      <div class="d-flex justify-content-between small text-muted">
        <span>Giao tiếp</span>
        <span>Bản ngữ</span>
      </div>
    </div>
    
    <button type="submit" class="btn btn-info text-white mt-2">Lưu thông tin kỹ năng</button>
  </form>
</div>

</body>
</html>
