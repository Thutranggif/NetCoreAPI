<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Trạng Thái Bản Thân</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>Tình trạng công việc</h2>
  <p>Hãy chọn trạng thái phù hợp nhất với mong muốn hợp tác của mình:</p>
  
  <form action="/action_page.php">
    <div class="form-check">
      <input type="radio" class="form-check-input" id="radio1" name="status" value="available" checked>
      <label class="form-check-label" for="radio1">Đang sẵn sàng cho các dự án mới (Freelance/Full-time)</label>
    </div>
    
    <div class="form-check">
      <input type="radio" class="form-check-input" id="radio2" name="status" value="parttime">
      <label class="form-check-label" for="radio2">Chỉ nhận tư vấn hoặc dự án ngắn hạn</label>
    </div>
    
    <div class="form-check">
      <input type="radio" class="form-check-input" id="radio3" name="status" value="busy" disabled>
      <label class="form-check-label" for="radio3">Đã đủ lịch trình (Hiện không nhận thêm việc)</label>
    </div>
    
    <button type="submit" class="btn btn-success mt-3">Cập nhật trạng thái</button>
  </form>
</div>

</body>
</html>
