<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Lựa Chọn Của Bản Thân</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>Khám phá sở thích của mình</h2>
  <p>Dưới đây là những lĩnh vực mình quan tâm và đang theo đuổi:</p>
  
  <form>
    <label for="goal" class="form-label">Mục tiêu lớn nhất năm nay:</label>
    <select id="goal" class="form-select form-select-lg">
      <option selected>-- Chọn mục tiêu --</option>
      <option>Trở thành Full-stack Developer</option>
      <option>Thành thạo tiếng Anh giao tiếp</option>
      <option>Hoàn thành dự án khởi nghiệp</option>
      <option>Đi du lịch xuyên Việt</option>
    </select>
    
    <label for="hobby" class="form-label mt-3">Sở thích lúc rảnh rỗi:</label>
    <select id="hobby" class="form-select">
      <option selected>-- Chọn sở thích --</option>
      <option>Đọc sách về tư duy/kinh doanh</option>
      <option>Nghe podcast phát triển bản thân</option>
      <option>Chơi thể thao (Bóng đá, Cầu lông)</option>
      <option>Học thêm một ngôn ngữ lập trình mới</option>
    </select>
    
    <label for="habit" class="form-label mt-3">Thói quen hàng ngày:</label>
    <select id="habit" class="form-select form-select-sm">
      <option selected>-- Chọn thói quen --</option>
      <option>Dậy sớm lúc 6:00 AM</option>
      <option>Viết nhật ký công việc</option>
      <option>Tập thể dục 30 phút</option>
      <option>Uống đủ 2 lít nước</option>
    </select>
  </form>    
</div>

</body>
</html>
