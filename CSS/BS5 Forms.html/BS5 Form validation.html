<!DOCTYPE html>
<html lang="en">
<head>
  <title>Xác nhận thông tin</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h3>Xác nhận gửi hồ sơ</h3>
  <p>Vui lòng kiểm tra lại tên và xác nhận để hoàn tất việc kết nối.</p>
    
  <form action="/action_page.php" class="was-validated">
    <div class="mb-3 mt-3">
      <label for="uname" class="form-label">Username:</label>
      <input type="text" class="form-control" id="uname" placeholder="Enter username" name="uname" required>
      <div class="valid-feedback">Tuyệt vời! Tên đã được nhập.</div>
      <div class="invalid-feedback">Vui lòng không để trống ô này.</div>
    </div>
    <div class="mb-3">
      <label for="pwd" class="form-label">Password:</label>
      <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd" required>
      <div class="valid-feedback">Tuyệt vời! Tên đã được nhập.</div>
      <div class="invalid-feedback">Vui lòng không để trống ô này.</div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="myCheck"  name="remember" required>
      <label class="form-check-label" for="myCheck">Tôi cam đoan những thông tin cung cấp phía trên là chính xác.</label>
      <div class="valid-feedback">Cảm ơn bạn đã xác nhận.</div>
      <div class="invalid-feedback">Bạn cần tích vào ô này để tiếp tục.</div>
    </div>
  <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

</body>
</html>
