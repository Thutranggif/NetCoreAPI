<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Giới Thiệu Bản Thân Thu Trang - Tooltip</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5 text-center">
  <h3>Khám phá về tôi</h3>
  <p>Hãy di chuột (hoặc chạm) vào các từ bên dưới để xem thông tin chi tiết:</p>
  
  <div class="mt-4">
    <a href="#" class="btn btn-outline-primary mx-2" data-bs-toggle="tooltip" data-bs-placement="top" title="Tôi là Nguyễn Thị Thu Trang, 22 tuổi">Họ tên</a>
    
    <a href="#" class="btn btn-outline-success mx-2" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Đến từ thành phố Hà Nội xinh đẹp">Quê quán</a>
    
    <a href="#" class="btn btn-outline-info mx-2" data-bs-toggle="tooltip" data-bs-placement="left" title="Thích lập trình và du lịch,chụp ảnh">Sở thích</a>
    
    <a href="#" class="btn btn-outline-danger mx-2" data-bs-toggle="tooltip" data-bs-placement="right" title="thutrangnguyen@email.com">Liên hệ</a>
  </div>
</div>

<script>
// Đoạn mã JavaScript để kích hoạt Tooltip của Bootstrap
var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
  return new bootstrap.Tooltip(tooltipTriggerEl)
})
</script>

</body>
</html>
