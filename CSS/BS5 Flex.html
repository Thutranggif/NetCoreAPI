<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Nguyễn Thị Thu Trang - Flexbox</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body> 

<div class="container mt-3">
  <h2>Tóm tắt về tôi</h2>
  <p>Dưới đây là 3 giá trị cốt lõi mà tôi mang đến cho mọi công việc:</p>
  
  <div class="d-flex justify-content-between p-3 bg-dark text-white rounded shadow">  
    <div class="p-3 bg-info text-dark rounded flex-fill mx-1 text-center">
      <strong>Nhiệt Huyết</strong><br>
      <small>Luôn sẵn sàng học hỏi</small>
    </div>
    <div class="p-3 bg-warning text-dark rounded flex-fill mx-1 text-center">
      <strong>Kỷ Luật</strong><br>
      <small>Đảm bảo đúng tiến độ</small>
    </div>
    <div class="p-3 bg-primary text-white rounded flex-fill mx-1 text-center">
      <strong>Sáng Tạo</strong><br>
      <small>Tìm kiếm giải pháp mới</small>
    </div>
  </div>
  
  <p class="mt-3 text-muted">
    <em>* Dù chưa có kinh nghiệm thực tế, tôi tập trung tối đa vào việc xây dựng thái độ làm việc chuyên nghiệp.</em>
  </p>
</div>

</body>
</html>
