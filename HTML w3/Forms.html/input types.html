<!DOCTYPE html>
<html>
<body>

<h2>Thông tin cá nhân</h2>
<p>Thẻ <strong>input type="text"</strong> định nghĩa một ô nhập liệu văn bản một dòng để bạn điền thông tin:</p>

<form action="/action_page.php">
  <label for="fname">Họ của bạn:</label><br>
  <input type="text" id="fname" name="fname"><br>
  <label for="lname">Tên của bạn:</label><br>
  <input type="text" id="lname" name="lname"><br><br>
  <input type="submit" value="Gửi đi">
</form>

<p>Lưu ý rằng bản thân thẻ form sẽ không hiển thị trên trình duyệt (chỉ hiển thị các thành phần bên trong).</p>
<p>Ngoài ra, độ rộng mặc định của một ô nhập liệu văn bản là 20 ký tự.</p>

</body>
</html>
